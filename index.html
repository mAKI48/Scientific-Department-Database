```html
<!-- =========================
     DOCUMENTS SECTION
     ========================= -->

<section id="documents" class="page">
  <div class="page-title">
    <h2>DOCUMENTS</h2>
    <p>General Scientific Department documentation.</p>
  </div>

  <div id="document-list" class="record-list"></div>
</section>


<!-- =========================
     DOCUMENT READER
     ========================= -->

<div id="document-reader" class="document-reader hidden">

  <div class="document-overlay" onclick="closeDocument()"></div>

  <div class="document-window">

    <div class="document-header">
      <div>
        <span class="document-classification">
          SCIENTIFIC DEPARTMENT DATABASE
        </span>

        <h2 id="document-reader-title">
          DOCUMENT
        </h2>
      </div>

      <button
        class="document-close"
        onclick="closeDocument()"
        aria-label="Close document"
      >
        ×
      </button>
    </div>


    <div class="document-meta">
      <span id="document-reader-id"></span>
      <span id="document-reader-author"></span>
      <span id="document-reader-date"></span>
    </div>


    <div
      class="document-content"
      id="document-reader-content"
    ></div>


    <div class="document-footer">
      <span>
        SCIENTIFIC DEPARTMENT // INTERNAL ARCHIVE
      </span>

      <button onclick="closeDocument()">
        CLOSE DOCUMENT
      </button>
    </div>

  </div>
</div>


<!-- =========================
     DOCUMENT STYLES
     ========================= -->

<style>

.document-reader {
  position: fixed;
  inset: 0;
  z-index: 99999;

  display: flex;
  align-items: center;
  justify-content: center;
}

.document-reader.hidden {
  display: none;
}


.document-overlay {
  position: absolute;
  inset: 0;

  background: rgba(0, 0, 0, 0.88);
}


.document-window {
  position: relative;

  width: min(900px, 90vw);
  max-height: 85vh;

  background: #111;

  border: 1px solid #555;

  box-shadow:
    0 0 40px rgba(0, 0, 0, 0.9);

  display: flex;
  flex-direction: column;

  z-index: 1;
}


/* HEADER */

.document-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  padding: 20px 24px;

  background: #181818;

  border-bottom: 1px solid #444;
}


.document-classification {
  display: block;

  font-size: 10px;

  letter-spacing: 2px;

  color: #777;
}


.document-header h2 {
  margin: 8px 0 0;

  font-size: 22px;

  color: #eee;
}


.document-close {
  width: 38px;
  height: 38px;

  background: transparent;

  border: 1px solid #555;

  color: #aaa;

  font-size: 25px;

  cursor: pointer;
}


.document-close:hover {
  background: #333;

  color: #fff;
}


/* META INFORMATION */

.document-meta {
  display: flex;

  flex-wrap: wrap;

  gap: 20px;

  padding: 12px 24px;

  background: #0c0c0c;

  border-bottom: 1px solid #333;

  color: #888;

  font-size: 11px;
}


/* DOCUMENT TEXT */

.document-content {
  padding: 30px;

  overflow-y: auto;

  min-height: 250px;

  color: #ccc;

  line-height: 1.7;

  font-size: 14px;
}


.document-content h3 {
  margin-top: 25px;

  margin-bottom: 10px;

  color: #eee;

  font-size: 15px;

  letter-spacing: 1px;
}


.document-content h3:first-child {
  margin-top: 0;
}


.document-content p {
  margin-bottom: 16px;
}


.document-content strong {
  color: #fff;
}


/* FOOTER */

.document-footer {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  padding: 12px 24px;

  background: #181818;

  border-top: 1px solid #444;

  color: #666;

  font-size: 9px;

  letter-spacing: 1px;
}


.document-footer button {
  background: transparent;

  border: 1px solid #555;

  color: #aaa;

  padding: 7px 14px;

  cursor: pointer;

  font-size: 10px;
}


.document-footer button:hover {
  background: #333;

  color: #fff;
}


/* CLICKABLE DOCUMENTS */

#document-list .document-record {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 20px;

  padding: 16px 18px;

  margin-bottom: 8px;

  background: rgba(255, 255, 255, 0.02);

  border: 1px solid #333;

  cursor: pointer;

  transition:
    background 0.15s ease,
    border-color 0.15s ease;
}


#document-list .document-record:hover {
  background: rgba(255, 255, 255, 0.06);

  border-color: #777;
}


.document-record-left {
  display: flex;

  flex-direction: column;

  gap: 5px;
}


.document-record-id {
  color: #777;

  font-size: 10px;

  letter-spacing: 1px;
}


.document-record-title {
  color: #ddd;

  font-size: 14px;
}


.document-record-description {
  color: #777;

  font-size: 11px;
}


.document-record-right {
  display: flex;

  flex-direction: column;

  align-items: flex-end;

  gap: 5px;

  white-space: nowrap;
}


.document-record-date {
  color: #666;

  font-size: 10px;
}


.document-read {
  color: #aaa;

  font-size: 10px;

  letter-spacing: 1px;
}


.document-record:hover .document-read {
  color: #fff;
}


/* MOBILE */

@media (max-width: 600px) {

  .document-window {
    width: 95vw;

    max-height: 90vh;
  }

  .document-header {
    padding: 16px;
  }

  .document-content {
    padding: 20px;
  }

  .document-meta {
    padding: 10px 16px;

    gap: 10px;
  }

  .document-footer {
    padding: 10px 16px;
  }

  #document-list .document-record {
    align-items: flex-start;
  }

  .document-record-right {
    align-items: flex-end;
  }

}

</style>


<!-- =========================
     DOCUMENT JAVASCRIPT
     ========================= -->

<script>

const documents = [

  {
    id: "DOC-001",

    title: "Scientific Department Research Protocol",

    description:
      "Standard procedures for scientific research and experimentation.",

    author: "Dr. ███████",

    date: "2026-08-01",

    content: `
      <h3>PURPOSE</h3>

      <p>
        This document establishes the standard research procedures
        to be followed by members of the Scientific Department.
      </p>

      <h3>RESEARCH REQUIREMENTS</h3>

      <p>
        All experiments involving anomalous objects must be approved
        by the appropriate clearance authority before testing begins.
      </p>

      <p>
        Researchers are required to document experimental conditions,
        observations, unexpected events, and final conclusions.
      </p>

      <h3>SECURITY NOTICE</h3>

      <p>
        Unauthorized distribution of this document is prohibited.
        Copies must remain within approved Foundation information systems.
      </p>
    `
  },


  {
    id: "DOC-002",

    title: "Containment Research Guidelines",

    description:
      "Guidelines for conducting research on contained anomalies.",

    author: "Scientific Department",

    date: "2026-07-24",

    content: `
      <h3>OVERVIEW</h3>

      <p>
        These guidelines describe recommended procedures for conducting
        scientific research on contained anomalies.
      </p>

      <h3>TESTING</h3>

      <p>
        Personnel must verify containment integrity before beginning
        any experiment.
      </p>

      <p>
        Testing must immediately cease if containment conditions
        change unexpectedly.
      </p>

      <h3>CLEARANCE</h3>

      <p>
        Access to experimental data is determined by personnel
        clearance level and the classification of the associated anomaly.
      </p>
    `
  },


  {
    id: "DOC-003",

    title: "Anomalous Materials Research",

    description:
      "Archived research concerning anomalous material properties.",

    author: "Research Division",

    date: "2026-07-18",

    content: `
      <h3>SUMMARY</h3>

      <p>
        Preliminary research has identified several unusual properties
        among recovered anomalous materials.
      </p>

      <h3>OBSERVATIONS</h3>

      <p>
        Samples demonstrated behavior inconsistent with conventional
        material science models.
      </p>

      <p>
        Further testing is required before a definitive classification
        can be assigned.
      </p>

      <h3>STATUS</h3>

      <p>
        Research remains ongoing.
      </p>
    `
  }

];


function renderDocuments() {

  const list =
    document.getElementById("document-list");

  if (!list) {
    return;
  }


  list.innerHTML = documents.map((doc, index) => {

    return `

      <div
        class="document-record"
        onclick="openDocument(${index})"
      >

        <div class="document-record-left">

          <span class="document-record-id">
            ${doc.id}
          </span>

          <span class="document-record-title">
            ${doc.title}
          </span>

          <span class="document-record-description">
            ${doc.description}
          </span>

        </div>


        <div class="document-record-right">

          <span class="document-record-date">
            ${doc.date}
          </span>

          <span class="document-read">
            READ MORE →
          </span>

        </div>

      </div>

    `;

  }).join("");

}


function openDocument(index) {

  const doc = documents[index];

  if (!doc) {
    return;
  }


  document.getElementById(
    "document-reader-title"
  ).textContent = doc.title;


  document.getElementById(
    "document-reader-id"
  ).textContent = doc.id;


  document.getElementById(
    "document-reader-author"
  ).textContent = "AUTHOR: " + doc.author;


  document.getElementById(
    "document-reader-date"
  ).textContent = "DATE: " + doc.date;


  document.getElementById(
    "document-reader-content"
  ).innerHTML = doc.content;


  document.getElementById(
    "document-reader"
  ).classList.remove("hidden");


  document.body.style.overflow = "hidden";

}


function closeDocument() {

  document.getElementById(
    "document-reader"
  ).classList.add("hidden");


  document.body.style.overflow = "";

}


/* ESC KEY CLOSES DOCUMENT */

document.addEventListener("keydown", function(event) {

  if (event.key === "Escape") {

    closeDocument();

  }

});


/* LOAD DOCUMENTS */

renderDocuments();

</script>
```
